# Shared document/speech engines for EVERY OPNinfer instance on this host.
#
# These services are stateless request/response converters — they store no
# client data — so ONE copy safely serves all portals and saves a lot of RAM
# versus running them per instance. deploy.sh brings this stack up as compose
# project "opninfer-engines"; each instance's app + worker join the shared
# external network "opninfer-engines" and reach the engines by service name
# (http://gotenberg:3000, http://docling:5001, http://whisper:9000,
# http://kokoro:8880).
#
# Tunables live in engines.env (generated by deploy.sh, git-ignored):
#   WHISPER_MODEL  tiny/base/small/medium/large-v3   (default small)
#   TTS_IMAGE      kokoro-fastapi-gpu image on a GPU host (default CPU)
name: opninfer-engines

services:
  # LibreOffice conversions (legacy Office/ODF → PDF). Lightweight.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s"]

  # OCR / complex-PDF extraction (scanned documents).
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.26.0
    restart: unless-stopped

  # Text-to-speech (Kokoro-82M via Kokoro-FastAPI, OpenAI-compatible with
  # chunked streaming). CPU image runs ≈2x realtime; on a GPU host set
  # TTS_IMAGE=ghcr.io/remsky/kokoro-fastapi-gpu:latest in engines.env and
  # uncomment the device reservation below (~35x realtime).
  kokoro:
    image: ${TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Audio transcription (faster-whisper). Downloads its model on first use and
  # unloads it after 5 idle minutes, so RAM is only held while transcribing.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.9.1
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_DEVICE: cpu
      MODEL_IDLE_TIMEOUT: "300"
    volumes:
      - whisper_cache:/root/.cache

networks:
  # The shared cross-instance network. Fixed name so instance stacks can join
  # it as an external network regardless of their own project names.
  default:
    name: opninfer-engines

volumes:
  whisper_cache:
